services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-students}
      POSTGRES_USER: ${POSTGRES_USER:-students}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-students-local-db-password}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-students}
      POSTGRES_USER: ${POSTGRES_USER:-students}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-students-local-db-password}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123}
    volumes:
      - jwt_secret:/app/secrets
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: frontend
    environment:
      BACKEND_URL: http://backend:8080
      HOST: 0.0.0.0
      PORT: "3000"
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ORIGIN: ${APP_ORIGIN:-http://localhost:${APP_PORT:-8088}}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: web
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  jwt_secret:
