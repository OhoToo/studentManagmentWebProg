<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Управление студентами</title>
    <link rel="icon" type="image/png" href="/favicon.png">

    <link
        rel="stylesheet"
        href="/css/styles.css"
    >

    <script
        type="module"
        src="/js/index.js"
    ></script>
</head>

<body>

    <header>
        <h1>Система "Управление студентами"</h1>
    </header>


    <main>

        <section id="list-section">

            <h2>Список студентов</h2>

            <p id="list-message" class="error-message" role="alert"></p>

            <form id="filter-form" class="filter-form">

                <label>
                    ФИО:

                    <input
                        type="text"
                        id="name-filter"
                        name="fullName"
                        placeholder="Иван или Иванов Иван"
                    >
                </label>

                <label>
                    Группа:

                    <input
                        type="text"
                        id="group-filter"
                        name="group"
                        placeholder="P3223"
                    >
                </label>


                <label>
                    Общежитие:

                    <input
                        type="number"
                        id="dormitory-filter"
                        name="dormitory"
                        min="1"
                        placeholder="8"
                    >
                </label>


                <label>
                    Сортировать по:
                    <select name="sort">
                        <option value="ID">ID</option>
                        <option value="fullName">ФИО</option>
                        <option value="group">Группа</option>
                        <option value="ISU">ИСУ</option>
                        <option value="dormNumber">Общежитие</option>
                        <option value="room">Комната</option>
                        <option value="dateArrived">Дата заселения</option>
                        <option value="isForeign">Иностранец</option>
                        <option value="notes">Заметки</option>
                    </select>
                </label>

                <label>
                    Порядок:
                    <select name="order">
                        <option value="asc">По возрастанию</option>
                        <option value="desc">По убыванию</option>
                    </select>
                </label>

                <label>
                    Студентов на странице:
                    <input type="number" name="size" value="10" min="1" step="1" required>
                </label>

                <div class="form-buttons">

                    <button
                        type="submit"
                    >
                        Фильтровать
                    </button>

                    <button
                        type="button"
                        id="reset-filter-button"
                        class="btn-cancel"
                    >
                        Сбросить
                    </button>

                </div>

            </form>


            <table id="student-table">

                <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Группа</th>
                        <th>ИСУ ID</th>
                        <th>Действия</th>
                    </tr>
                </thead>

                <tbody id="students-tbody">
                </tbody>

            </table>

            <nav class="pagination" aria-label="Страницы списка студентов">
                <button type="button" id="previous-page" disabled>Назад</button>
                <span id="page-number" aria-live="polite">Страница 1</span>
                <button type="button" id="next-page" disabled>Далее</button>
            </nav>

        </section>


        <div class="add-button-wrapper hidden" id="add-student-panel">

            <button
                id="show-add-form-bin"
                class="form-button"
                type="button"
            >
                Добавить студента
            </button>

        </div>

    </main>

</body>

</html>
